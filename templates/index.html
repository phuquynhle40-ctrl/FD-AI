<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FD AI 0.2</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}
        .box{max-width:700px;margin:auto;padding:25px}
        .logo{width:90px;height:90px;border-radius:50%;margin:auto;display:block}
        h1{text-align:center;color:#20d9ff;margin:12px 0 4px}
        .ver{text-align:center;color:#8da3b8;margin-bottom:25px}
        .chat{background:#0d1b2a;border:1px solid #17344d;border-radius:18px;padding:18px}
        textarea{width:100%;height:110px;background:#07111f;color:#fff;border:1px solid #24506b;border-radius:12px;padding:14px;font-size:16px}
        button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#10cfff;color:#00131d;font-weight:bold;font-size:16px}
        #result{margin-top:18px;white-space:pre-wrap;color:#bdefff}
    </style>
</head>
<body>
<div class="box">
    <img class="logo" src="{{ url_for('static', filename='FD-AI-0.2.png') }}">
    <h1>FD AI 0.2</h1>
    <div class="ver">Trợ lý AI thông minh hơn mỗi ngày</div>

    <div class="chat">
        <textarea id="message" placeholder="Nhập nội dung bạn muốn hỏi..."></textarea>
        <button onclick="sendMessage()">Gửi</button>
        <div id="result"></div>
    </div>
</div>

<script>
async function sendMessage(){
    const message=document.getElementById("message").value.trim();
    if(!message)return;
    const result=document.getElementById("result");
    result.textContent="FD AI đang xử lý...";
    try{
        const r=await fetch("/api/chat",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message})
        });
        const data=await r.json();
        result.textContent=data.message || JSON.stringify(data,null,2);
    }catch(e){
        result.textContent="Không thể kết nối FD AI.";
    }
}
</script>
</body>
</html>
